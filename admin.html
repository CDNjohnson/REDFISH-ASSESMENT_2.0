<!DOCTYPE html>
<html>
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Operations Skills Assessment Results</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F4F6F5; --surface:#FFFFFF; --ink:#16232A; --ink-secondary:#4B5F68; --ink-muted:#7E8F96;
    --line:#D8E0E0; --line-strong:#B9C6C6; --accent:#1C5F7A; --accent-ink:#FFFFFF; --accent-soft:#DCEBEF;
    --danger:#A6402C; --shadow:0 1px 2px rgba(22,35,42,.06), 0 8px 24px rgba(22,35,42,.06);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Source Sans 3",system-ui,sans-serif; padding:24px 16px; }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; }
  .wrap{ max-width:1040px; margin:0 auto; }
  h1{ font-size:24px; margin:0 0 4px; }
  .header-logo{ height:36px; width:auto; display:block; margin-bottom:14px; }
  .sub{ color:var(--ink-secondary); font-size:14px; margin-bottom:24px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); padding:28px; }
  @media (max-width:520px){ .card{ padding:18px 14px; } }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-secondary); margin-bottom:6px; }
  .field input{ width:100%; font-size:15px; padding:10px 12px; border:1px solid var(--line-strong); border-radius:4px; font-family:inherit; }
  .btn{ display:inline-flex; align-items:center; gap:8px; font-size:14.5px; font-weight:600; border-radius:4px; padding:10px 18px; border:1px solid transparent; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; color:var(--ink-secondary); border-color:var(--line-strong); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--ink-secondary); }
  .err{ color:var(--danger); font-size:13.5px; margin-top:10px; display:none; }
  .err.show{ display:block; }
  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .topbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-secondary); }
  tr.data-row:hover td{ background:var(--accent-soft); cursor:pointer; }
  .score-badge{ font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--accent); }
  .empty{ color:var(--ink-muted); padding:30px 0; text-align:center; }
  .loading{ color:var(--ink-muted); padding:30px 0; text-align:center; font-style:italic; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(16,23,26,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:10; }
  .modal{ background:var(--surface); border-radius:6px; max-width:640px; width:100%; padding:28px; max-height:calc(100vh - 80px); overflow:auto; }
  .modal .close{ float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-muted); }
  .modal h2{ margin-top:0; font-size:20px; }

  .score-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:18px 0 26px; }
  @media (max-width:560px){ .score-tiles{ grid-template-columns:repeat(2,1fr); } }
  .tile{ background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:14px 12px; text-align:center; }
  .tile .tile-val{ font-size:22px; font-weight:700; color:var(--accent); line-height:1; margin-bottom:6px; }
  .tile .tile-label{ font-size:11px; color:var(--ink-secondary); line-height:1.3; }

  .res-section{ margin-bottom:26px; }
  .res-section h3{ font-size:16px; margin:0 0 4px; }
  .res-section .res-blurb{ font-size:12.5px; color:var(--ink-muted); margin:0 0 12px; }
  .bar-row{ margin-bottom:12px; }
  .bar-labels{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .bar-labels b{ color:var(--ink); font-weight:600; }
  .bar-labels span.pct{ color:var(--ink-secondary); }
  .bar-track{ height:8px; background:var(--line); border-radius:4px; position:relative; overflow:hidden; }
  .bar-fill{ position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:4px; }

  .written-block{ background:var(--bg); border-left:3px solid var(--accent); border-radius:0 4px 4px 0; padding:14px 16px; font-size:14.5px; line-height:1.6; white-space:pre-wrap; margin-bottom:6px; }
  .written-flag{ font-size:12px; color:var(--ink-secondary); font-weight:600; margin-bottom:8px; }
  .learning-tip{ background:var(--accent-soft); border-radius:4px; padding:14px 16px; font-size:13.5px; line-height:1.55; color:var(--ink); margin-top:6px; }
  .learning-tip b{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin-bottom:4px; }

  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">

  <section id="screen-login">
    <img src="redfish-logo.png" alt="Redfish Investments" class="header-logo">
    <h1>Assessment Results</h1>
    <p class="sub">Sign in with your admin account to view submitted assessments.</p>
    <div class="card" style="max-width:380px;">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <input type="password" id="login-pass" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="btn-login" type="button">Sign in</button>
      <div class="err" id="login-err"></div>
    </div>
  </section>

  <section id="screen-dash" hidden>
    <div class="topbar">
      <div>
        <img src="redfish-logo.png" alt="Redfish Investments" class="header-logo">
        <h1>Operations Skills Assessment — Results</h1>
        <p class="sub mono" id="signed-in-as"></p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-refresh" type="button">Refresh</button>
        <button class="btn btn-ghost" id="btn-export" type="button">Export CSV</button>
        <button class="btn btn-ghost" id="btn-logout" type="button">Sign out</button>
      </div>
    </div>
    <div class="card">
      <table id="results-table">
        <thead>
          <tr><th>Date</th><th>Candidate</th><th>Role</th><th>Comp.</th><th>Ops</th><th>Reasoning</th><th>Learning style</th></tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <div class="loading" id="results-loading">Loading submissions&hellip;</div>
      <div class="empty" id="results-empty" hidden>No submissions yet.</div>
    </div>
  </section>

</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal">
    <button class="close" id="modal-close" type="button">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  "use strict";

  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("PASTE_") === 0) {
    document.getElementById("login-err").textContent = "This page isn't connected to Firebase yet — fill in firebase-config.js.";
    document.getElementById("login-err").classList.add("show");
  }
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var COMP_CATS = ["Spreadsheets","Email & Files","Security & Troubleshooting","Scheduling"];
  var OPS_CATS = ["Numeracy","Process"];
  var REASONING_CATS = ["Numerical","Logical","Situational"];
  var STYLE_META = {
    V:{ label:"Visual", tip:"Pair training with diagrams, flowcharts, labeled photos, or written visuals of the workflow rather than long verbal explanations alone." },
    A:{ label:"Auditory", tip:"Walk them through new processes verbally and let them ask questions out loud — a talk-through will stick better than a manual alone." },
    R:{ label:"Reading/Writing", tip:"Give them written SOPs, checklists, and reference docs they can study and revisit — they'll retain material better after reading it." },
    K:{ label:"Hands-On", tip:"Let them shadow briefly, then try the task themselves quickly — short practice reps beat long briefings for this person." }
  };

  var screenLogin = document.getElementById("screen-login");
  var screenDash = document.getElementById("screen-dash");
  var loginErr = document.getElementById("login-err");
  var submissions = [];

  document.getElementById("btn-login").addEventListener("click", function(){
    var email = document.getElementById("login-email").value.trim();
    var pass = document.getElementById("login-pass").value;
    loginErr.classList.remove("show");
    auth.signInWithEmailAndPassword(email, pass).catch(function(err){
      loginErr.textContent = err.message;
      loginErr.classList.add("show");
    });
  });

  document.getElementById("btn-logout").addEventListener("click", function(){ auth.signOut(); });

  auth.onAuthStateChanged(function(user){
    if (user) {
      screenLogin.hidden = true; screenDash.hidden = false;
      document.getElementById("signed-in-as").textContent = "Signed in as " + user.email;
      loadSubmissions();
    } else {
      screenLogin.hidden = false; screenDash.hidden = true;
    }
  });

  function loadSubmissions(){
    document.getElementById("results-loading").hidden = false;
    document.getElementById("results-empty").hidden = true;
    db.collection("submissions").orderBy("submittedAt", "desc").get().then(function(snap){
      submissions = [];
      snap.forEach(function(doc){ submissions.push(Object.assign({ id: doc.id }, doc.data())); });
      renderTable();
    }).catch(function(err){
      console.error(err);
      document.getElementById("results-loading").hidden = true;
      alert("Couldn't load results: " + err.message);
    });
  }
  document.getElementById("btn-refresh").addEventListener("click", loadSubmissions);

  function pct(c, t){ return t ? Math.round(c / t * 100) : 0; }

  function renderTable(){
    var body = document.getElementById("results-body");
    var empty = document.getElementById("results-empty");
    var loading = document.getElementById("results-loading");
    loading.hidden = true;
    body.innerHTML = "";
    if (!submissions.length) { empty.hidden = false; return; }
    empty.hidden = true;
    submissions.forEach(function(s, idx){
      var tr = document.createElement("tr");
      tr.className = "data-row";
      var date = s.submittedAt && s.submittedAt.toDate ? s.submittedAt.toDate() : null;
      var primaryLabel = s.learning && s.learning.primaryLabel ? s.learning.primaryLabel : "—";
      tr.innerHTML =
        "<td>" + (date ? date.toLocaleDateString() : "—") + "</td>" +
        "<td>" + escapeHtml(s.name || "") + "</td>" +
        "<td>" + escapeHtml(s.role || "—") + "</td>" +
        "<td class='score-badge'>" + (s.comp ? s.comp.correct + "/" + s.comp.total : "—") + "</td>" +
        "<td class='score-badge'>" + (s.ops ? s.ops.correct + "/" + s.ops.total : "—") + "</td>" +
        "<td class='score-badge'>" + (s.reasoning ? s.reasoning.correct + "/" + s.reasoning.total : "—") + "</td>" +
        "<td>" + escapeHtml(primaryLabel) + "</td>";
      tr.addEventListener("click", function(){ openModal(idx); });
      body.appendChild(tr);
    });
  }

  function bar(container, label, valueText, pctVal){
    var row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML =
      '<div class="bar-labels"><b>' + escapeHtml(label) + '</b><span class="pct mono">' + escapeHtml(valueText) + '</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pctVal + '%"></div></div>';
    container.appendChild(row);
  }

  function openModal(idx){
    var s = submissions[idx];
    var modal = document.getElementById("modal");
    var body = document.getElementById("modal-body");
    var date = s.submittedAt && s.submittedAt.toDate ? s.submittedAt.toDate() : null;

    var learning = s.learning || {};
    var sums = learning.styleSums || {V:0,A:0,R:0,K:0};
    var styleTotal = (sums.V||0)+(sums.A||0)+(sums.R||0)+(sums.K||0) || 1;

    body.innerHTML =
      "<button class='close' id='modal-close-inner' type='button'>&times;</button>" +
      "<h2>" + escapeHtml(s.name || "") + "</h2>" +
      "<p class='sub' style='margin-bottom:0;'>" + (s.role ? "Role: " + escapeHtml(s.role) + " &middot; " : "") + (date ? date.toLocaleString() : "") + "</p>";

    var tiles = document.createElement("div");
    tiles.className = "score-tiles";
    tiles.innerHTML =
      '<div class="tile"><div class="tile-val">' + (s.comp ? s.comp.correct+'/'+s.comp.total : '—') + '</div><div class="tile-label">Computer Competency</div></div>' +
      '<div class="tile"><div class="tile-val">' + (s.ops ? s.ops.correct+'/'+s.ops.total : '—') + '</div><div class="tile-label">Ops Aptitude &amp; Numeracy</div></div>' +
      '<div class="tile"><div class="tile-val">' + (s.reasoning ? s.reasoning.correct+'/'+s.reasoning.total : '—') + '</div><div class="tile-label">Reasoning</div></div>' +
      '<div class="tile"><div class="tile-val">' + escapeHtml(learning.primaryLabel || "—") + '</div><div class="tile-label">Primary Learning Style</div></div>';
    body.appendChild(tiles);

    function section(title, blurb, cats, byCategory){
      var sec = document.createElement("div");
      sec.className = "res-section";
      sec.innerHTML = "<h3>" + escapeHtml(title) + "</h3><p class='res-blurb'>" + escapeHtml(blurb) + "</p>";
      cats.forEach(function(cat){
        var d = byCategory && byCategory[cat];
        if (!d) return;
        bar(sec, cat, d.c + "/" + d.t, pct(d.c, d.t));
      });
      body.appendChild(sec);
    }

    section("Computer Competency", "By category.", COMP_CATS, s.comp && s.comp.byCategory);
    section("Ops Aptitude & Numeracy", "Business math and process judgment.", OPS_CATS, s.ops && s.ops.byCategory);

    var writtenSec = document.createElement("div");
    writtenSec.className = "res-section";
    writtenSec.innerHTML =
      "<div class='written-flag'>Written response — not auto-scored, for your review:</div>" +
      "<div class='written-block'>" + escapeHtml(s.writtenResponse || "(no response recorded)") + "</div>";
    body.appendChild(writtenSec);

    section("Reasoning", "Numerical/logical items are scored; situational items are guidance only.", REASONING_CATS, s.reasoning && s.reasoning.byCategory);

    var learnSec = document.createElement("div");
    learnSec.className = "res-section";
    learnSec.innerHTML = "<h3>How They Learn</h3><p class='res-blurb'>Self-reported preference, not right/wrong.</p>";
    ["V","A","R","K"].forEach(function(k){
      bar(learnSec, STYLE_META[k].label, pct(sums[k]||0, styleTotal) + "%", pct(sums[k]||0, styleTotal));
    });
    var primaryKey = Object.keys(STYLE_META).filter(function(k){ return STYLE_META[k].label === (learning.primaryStyle ? STYLE_META[learning.primaryStyle].label : null); })[0];
    var tipKey = learning.primaryStyle && STYLE_META[learning.primaryStyle] ? learning.primaryStyle : null;
    if (tipKey) {
      var tip = document.createElement("div");
      tip.className = "learning-tip";
      tip.innerHTML = "<b>Onboarding tip</b>" + escapeHtml(STYLE_META[tipKey].tip);
      learnSec.appendChild(tip);
    }
    body.appendChild(learnSec);

    modal.hidden = false;
    document.getElementById("modal-close-inner").addEventListener("click", function(){ modal.hidden = true; });
  }

  document.getElementById("modal-close").addEventListener("click", function(){ document.getElementById("modal").hidden = true; });
  document.getElementById("modal").addEventListener("click", function(e){ if (e.target.id === "modal") document.getElementById("modal").hidden = true; });

  document.getElementById("btn-export").addEventListener("click", function(){
    if (!submissions.length) return;
    var rows = [["Date","Name","Role","Comp","Ops","Reasoning","Learning Style","Written Response"].join(",")];
    submissions.forEach(function(s){
      var date = s.submittedAt && s.submittedAt.toDate ? s.submittedAt.toDate().toISOString() : "";
      var vals = [
        date, s.name || "", s.role || "",
        s.comp ? s.comp.correct + "/" + s.comp.total : "",
        s.ops ? s.ops.correct + "/" + s.ops.total : "",
        s.reasoning ? s.reasoning.correct + "/" + s.reasoning.total : "",
        (s.learning && s.learning.primaryLabel) || "",
        s.writtenResponse || ""
      ];
      rows.push(vals.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(","));
    });
    var blob = new Blob([rows.join("\n")], { type: "text/csv" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "ops-assessment-results.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
})();
</script>
</body>
</html>
